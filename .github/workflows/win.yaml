name: Build & Release FFmpeg Windows (Static x264 + x265)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ffmpeg:
    runs-on: windows-latest

    steps:
      - name: Checkout FFmpeg source
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          path: ffmpeg

      - name: Install MSYS2 and base tools
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            git
            make
            nasm
            mingw-w64-x86_64-pkg-config
            unzip
            wget
            p7zip

      - name: Build x264 static
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure --prefix=/mingw64 --host=x86_64-w64-mingw32 --enable-static --disable-opencl --disable-cli
          make -j$(nproc)
          make install

      - name: Build x265 static (with CMake 3.28.3)
        shell: msys2 {0}
        run: |
          wget https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-windows-x86_64.zip
          unzip cmake-3.28.3-windows-x86_64.zip -d /tmp/cmake3
          export PATH="/tmp/cmake3/cmake-3.28.3-windows-x86_64/bin:$PATH"
          git clone https://github.com/videolan/x265.git
          cd x265
          rm -rf build
          mkdir build
          cd build
          cmake -G "MSYS Makefiles" -DCMAKE_INSTALL_PREFIX=/mingw64 -DENABLE_SHARED=OFF -DENABLE_CLI=OFF ../source
          make -j$(nproc)
          make install
          ls -lh /mingw64/lib/pkgconfig/x265.pc  # debug: cek file .pc

      - name: Build FFmpeg static with x264 x265
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          cd ffmpeg
          ./configure \
            --prefix=/mingw64 \
            --pkg-config="pkg-config --static" \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --extra-cflags="-I/mingw64/include" \
            --extra-ldflags="-L/mingw64/lib"
          make -j$(nproc)
          make install

      - name: List ffmpeg binary
        run: dir msys64\mingw64\bin

      - name: Compress FFmpeg binaries
        run: 7z a ffmpeg-windows-x64.zip msys64\mingw64\bin\ffmpeg.exe msys64\mingw64\bin\ffprobe.exe

      - name: Create/Update Release (nightly-main)
        uses: ncipollo/release-action@v1
        with:
          tag: nightly-main
          name: Nightly Main
          body: "Automated static build (Windows, x264+x265) from latest push to main branch."
          allowUpdates: true
          prerelease: true

      - name: Upload FFmpeg to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ffmpeg-windows-x64.zip
          tag_name: nightly-main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
