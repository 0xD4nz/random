name: Build FFmpeg Windows (x264 + x265 Static)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ffmpeg:
    runs-on: windows-latest

    steps:
      - name: Checkout FFmpeg source
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          path: ffmpeg

      - name: Install MSYS2 and tools
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            git
            make
            nasm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config

      - name: Build x264 static
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure --prefix=/mingw64 --host=x86_64-w64-mingw32 --enable-static --disable-opencl --disable-cli
          make -j$(nproc)
          make install

      - name: Build x265 static
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/videolan/x265.git
          cd x265/build/msys2
          cmake -G "MSYS Makefiles" -DCMAKE_INSTALL_PREFIX=/mingw64 -DENABLE_SHARED=OFF -DENABLE_CLI=OFF ../../source
          make -j$(nproc)
          make install

      - name: Build FFmpeg static with x264 x265
        shell: msys2 {0}
        run: |
          cd ffmpeg
          ./configure \
            --toolchain=msvc \
            --prefix=/mingw64 \
            --pkg-config=pkg-config \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --extra-cflags="-I/mingw64/include" \
            --extra-ldflags="-L/mingw64/lib"
          make -j$(nproc)
          make install

      - name: Upload FFmpeg binary
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x64
          path: |
            /c/msys64/mingw64/bin/ffmpeg.exe
            /c/msys64/mingw64/bin/ffprobe.exe
