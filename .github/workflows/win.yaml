name: Build FFmpeg Static with x265 (Windows)

on:
  workflow_dispatch:

jobs:
  build-ffmpeg-x265-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Install MSYS2 & dependencies
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            make
            cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-cmake
            base-devel
            wget

      - name: Download & build x265 v3.5 (static)
        run: |
          mkdir -p /c/build && cd /c/build
          wget https://bitbucket.org/multicoreware/x265_git/get/3.5.tar.gz -O x265-3.5.tar.gz
          tar xzf x265-3.5.tar.gz
          mv multicoreware-x265_git-* x265
          cd x265
          mkdir build_x265
          cd build_x265
          cmake -G "MSYS Makefiles" -DCMAKE_INSTALL_PREFIX=/c/ffmpeg-build -DENABLE_SHARED=off ../source
          make -j$(nproc)
          make install

      - name: Build latest FFmpeg (static)
        run: |
          cd /c/build
          git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg
          cd ffmpeg
          export PKG_CONFIG_PATH="/c/ffmpeg-build/lib/pkgconfig"
          ./configure \
            --prefix="/c/ffmpeg-build" \
            --pkg-config-flags="--static" \
            --extra-cflags="-I/c/ffmpeg-build/include" \
            --extra-ldflags="-L/c/ffmpeg-build/lib -static" \
            --extra-libs="-lpthread -lm" \
            --enable-gpl \
            --enable-libx265 \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --toolchain=msys2.mingw64 \
            --target-os=mingw32 \
            --arch=x86_64
          make -j$(nproc)
          make install

      - name: Upload ffmpeg.exe (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static-x265-windows
          path: C:\ffmpeg-build\bin\ffmpeg.exe
